<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="gates" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M16 34V18M32 34V18M13 16h22" fill="none" stroke="#ece9e2" stroke-opacity="0.06" stroke-width="1.5" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1522" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0c1522" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c1522" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c1522"/>
  <rect width="1200" height="630" fill="url(#gates)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#62b7d6"/>

  <!-- mark -->
  <g transform="translate(80 78) scale(2.6)">
    <rect x="4" y="5" width="24" height="4" rx="1.5" fill="#ece9e2"/>
    <rect x="7" y="9" width="4" height="19" rx="1" fill="#ece9e2"/>
    <rect x="21" y="9" width="4" height="19" rx="1" fill="#ece9e2"/>
    <rect x="11" y="16" width="10" height="3" rx="1" fill="#62b7d6"/>
  </g>
  <text x="180" y="146" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#ece9e2" letter-spacing="-1">DGF-Bench</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#d2d8e1" font-size="42">
    <text x="80" y="262">A benchmark for simulating and auditing</text>
    <text x="80" y="314">deception against multi-agent</text>
    <text x="80" y="366">governance boards</text>
  </g>

  <!-- a route of gates: specialists, then the General gate -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="80" y="430" width="120" height="52" rx="8" fill="#111d2e" stroke="#36496a"/>
    <text x="140" y="463" fill="#ece9e2">IT</text>
    <path d="M204 456h26" stroke="#a4afbe" stroke-width="2"/><path d="M230 450l8 6-8 6z" fill="#a4afbe"/>
    <rect x="242" y="430" width="160" height="52" rx="8" fill="#111d2e" stroke="#36496a"/>
    <text x="322" y="463" fill="#ece9e2">Architecture</text>
    <path d="M406 456h26" stroke="#a4afbe" stroke-width="2"/><path d="M432 450l8 6-8 6z" fill="#a4afbe"/>
    <rect x="444" y="430" width="136" height="52" rx="8" fill="#111d2e" stroke="#36496a"/>
    <text x="512" y="463" fill="#ece9e2">Security</text>
    <path d="M584 456h26" stroke="#a4afbe" stroke-width="2"/><path d="M610 450l8 6-8 6z" fill="#a4afbe"/>
    <rect x="622" y="430" width="180" height="52" rx="8" fill="#111d2e" stroke="#36496a"/>
    <text x="712" y="463" fill="#ece9e2">Tech readiness</text>
    <path d="M806 456h26" stroke="#a4afbe" stroke-width="2"/><path d="M832 450l8 6-8 6z" fill="#a4afbe"/>
    <rect x="844" y="430" width="136" height="52" rx="8" fill="#ece9e2"/>
    <text x="912" y="463" fill="#0c1522">General</text>
  </g>

  <path d="M80 540H1120" stroke="#24344c" stroke-width="2"/>
  <text x="80" y="586" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#62b7d6">dgfbench.com</text>
  <text x="1120" y="586" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#a4afbe">Open source · defensive security · tool-using LLM agents</text>
</svg>
